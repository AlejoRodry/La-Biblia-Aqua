<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ocean Blue App Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#009bff" />
      <stop offset="40%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#006ee8" />
    </linearGradient>

    <!-- Subtle bottom-left diagonal facet highlight -->
    <linearGradient id="facetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007df0" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#0088ff" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#0088ff" stop-opacity="0" />
    </linearGradient>

    <!-- Outer B path (fillable solid) -->
    <!-- Stem: x=72 to 168. Top lobe: x up to 418. Bottom lobe: x up to 452. Top: y=60, Bottom: y=452 -->
    <clipPath id="bClip">
      <path d="M 72 74
               C 72 64, 80 58, 92 58
               L 296 58
               C 368 58, 418 94, 418 156
               C 418 206, 386 238, 342 246
               C 398 256, 452 292, 452 358
               C 452 422, 402 454, 312 454
               L 92 454
               C 80 454, 72 448, 72 438
               Z" />
    </clipPath>
  </defs>

  <!-- 1. Background Rounded App Square -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- 2. Bottom-left diagonal facet shadow/light cut (matching reference image) -->
  <path d="M 0 330 L 260 512 L 0 512 Z" fill="url(#facetGrad)" opacity="0.45" />
  <path d="M 0 512 L 420 512 L 0 240 Z" fill="#0066d6" opacity="0.12" />

  <!-- 3. Letter B Base Group -->
  <g id="letterB">
    <!-- Masked Interior of B -->
    <g clip-path="url(#bClip)">
      <!-- Background of B matches ocean backdrop -->
      <rect x="50" y="40" width="420" height="430" fill="url(#bgGrad)" />

      <!-- The Water Wave Filling the Lower Half -->
      <!-- Curves smoothly from left stem (y=298) upwards into a crest at y=190, then down to waist at y=215 -->
      <path d="M 50 512
               L 50 298
               C 105 292, 160 262, 230 226
               C 285 196, 345 186, 395 192
               C 425 196, 445 204, 470 215
               L 470 512
               Z"
            fill="#ffffff" />
            
      <!-- Water wave crest soft foam/lighting accent -->
      <path d="M 50 298
               C 105 292, 160 262, 230 226
               C 285 196, 345 186, 395 192
               C 425 196, 445 204, 470 215"
            stroke="rgba(255, 255, 255, 0.9)"
            stroke-width="5"
            fill="none" />
    </g>

    <!-- 4. Top Counter (Hole): In the blue upper region -->
    <path d="M 168 124
             L 262 124
             C 292 124, 312 136, 312 166
             C 312 196, 292 208, 262 208
             L 168 208
             Z"
          fill="url(#bgGrad)"
          stroke="#ffffff"
          stroke-width="13"
          stroke-linejoin="round" />
          
    <!-- Inner subtle line on top counter -->
    <path d="M 175 133 L 256 133 C 280 133, 300 144, 300 166 C 300 188, 280 199, 256 199 L 175 199"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          opacity="0.8" />

    <!-- 5. Bottom Counter (Hole): In the white water lower region -->
    <!-- Pill / bullet shape (flat left, rounded semi-circle right) filled with blue ocean -->
    <path d="M 168 304
             L 262 304
             C 288 304, 308 318, 308 340
             C 308 362, 288 376, 262 376
             L 168 376
             Z"
          fill="url(#bgGrad)"
          stroke="#ffffff"
          stroke-width="13"
          stroke-linejoin="round" />

    <!-- Inner subtle line on bottom counter -->
    <path d="M 175 313 L 258 313 C 278 313, 296 324, 296 340 C 296 356, 278 367, 258 367 L 175 367"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          opacity="0.8" />

    <!-- 6. Outer Crisp White Contour of Letter B -->
    <path d="M 72 74
             C 72 64, 80 58, 92 58
             L 296 58
             C 368 58, 418 94, 418 156
             C 418 206, 386 238, 342 246
             C 398 256, 452 292, 452 358
             C 452 422, 402 454, 312 454
             L 92 454
             C 80 454, 72 448, 72 438
             Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="13"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- 7. Inner Double-Contour Accents (The distinctive glassy water outline from the image) -->
    <!-- Stem vertical inner stroke -->
    <line x1="84" y1="82" x2="84" y2="430"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.85" />

    <!-- Top bar and top lobe inner curve -->
    <path d="M 98 70
             L 294 70
             C 358 70, 404 102, 404 156
             C 404 198, 376 226, 336 234"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.75" />

    <!-- Bottom lobe inner curve -->
    <path d="M 334 258
             C 388 268, 438 300, 438 358
             C 438 412, 392 442, 312 442
             L 100 442"
          fill="none"
          stroke="#ffffff"
          stroke-width="3"
          stroke-linecap="round"
          opacity="0.75" />

    <!-- Bottom edge water highlight sheen -->
    <path d="M 300 445 L 340 445"
          stroke="#ffffff"
          stroke-width="4"
          stroke-linecap="round"
          opacity="0.9" />
  </g>
</svg>

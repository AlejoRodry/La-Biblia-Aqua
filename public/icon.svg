<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#07111e" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Card / App Icon Shape -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyan-glow)" stroke-width="3" opacity="0.3" />

  <!-- Ambient background glow -->
  <circle cx="256" cy="240" r="140" fill="#00f2fe" opacity="0.12" filter="url(#soft-glow)" />

  <!-- Open Bible Symbol -->
  <g transform="translate(0, 10)">
    <!-- Book Pages / Spine Shadow -->
    <path d="M 256 345 C 210 325 150 325 90 340 L 90 200 C 150 185 210 185 256 205 C 302 185 362 185 422 200 L 422 340 C 362 325 302 325 256 345 Z" fill="#05101d" opacity="0.5" />
    
    <!-- Left Page Base -->
    <path d="M 256 335 C 210 315 155 315 96 330 L 96 185 C 155 170 210 170 256 190 Z" fill="#f8fafc" />
    <path d="M 256 335 C 210 315 155 315 96 330 L 96 185 C 155 170 210 170 256 190 Z" fill="url(#gold-grad)" opacity="0.15" />
    
    <!-- Right Page Base -->
    <path d="M 256 335 C 302 315 357 315 416 330 L 416 185 C 357 170 302 170 256 190 Z" fill="#ffffff" />
    <path d="M 256 335 C 302 315 357 315 416 330 L 416 185 C 357 170 302 170 256 190 Z" fill="url(#gold-grad)" opacity="0.1" />

    <!-- Page Edge Layers (3D depth) -->
    <path d="M 96 330 C 155 315 210 315 256 335 L 256 342 C 210 322 155 322 96 337 Z" fill="#e2e8f0" />
    <path d="M 416 330 C 357 315 302 315 256 335 L 256 342 C 302 322 357 322 416 337 Z" fill="#cbd5e1" />

    <!-- Spine / Center seam -->
    <path d="M 253 190 L 259 190 L 259 342 L 253 342 Z" fill="#0f172a" opacity="0.4" />
    <!-- Red Ribbon Bookmark -->
    <path d="M 253 190 Q 256 260 258 375 L 268 360 L 278 375 Q 262 260 259 190 Z" fill="#ef4444" />

    <!-- Text Lines Simulation on Left Page -->
    <line x1="130" y1="215" x2="225" y2="215" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <line x1="130" y1="235" x2="225" y2="235" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <line x1="130" y1="255" x2="225" y2="255" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <line x1="130" y1="275" x2="200" y2="275" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <line x1="130" y1="295" x2="215" y2="295" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.4" />

    <!-- Latin Cross on Right Page -->
    <g transform="translate(336, 255) scale(0.9)">
      <!-- Vertical beam -->
      <rect x="-6" y="-42" width="12" height="60" rx="3" fill="url(#gold-grad)" filter="url(#soft-glow)" />
      <!-- Horizontal beam -->
      <rect x="-24" y="-28" width="48" height="12" rx="3" fill="url(#gold-grad)" filter="url(#soft-glow)" />
    </g>
  </g>

  <!-- Wordmark 'BIBLIA' at the bottom of icon -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="8" fill="#ffffff" opacity="0.95">BIBLIA</text>
</svg>
